services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: chat_rooms
      MYSQL_USER: chat_user
      MYSQL_PASSWORD: 123456
    ports:
      - "3307:3306"   # 宿主机 3306 已被本地 MySQL 占用，用 3307 暴露
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "chat_user", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # 覆盖 .env 中的 localhost 地址，指向 docker service
      DATABASE_URL: mysql+aiomysql://chat_user:123456@mysql:3306/chat_rooms
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # 挂载源码，uvicorn --reload 热重载
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      # 挂载源码，Vite dev server 热重载
      - ./frontend:/app
      # 避免宿主机 node_modules 覆盖容器内安装的
      - /app/node_modules

volumes:
  mysql_data:
